name: Feature request
description: Suggest an idea or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation you are in, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
